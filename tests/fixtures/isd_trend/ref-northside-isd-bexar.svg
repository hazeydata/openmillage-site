<svg xmlns="http://www.w3.org/2000/svg" width="360" height="164" class="isd-t" viewBox="0 0 360 164" role="img" aria-label="Northside ISD’s total tax rate went from 1.2613 per $100 of taxable value in 2021 to 1.0049 in 2025 (preliminary)." focusable="false"><style>.isd-t text{font-family:var(--font-body,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);font-size:13px;font-variant-numeric:tabular-nums}.isd-t .v{fill:var(--fg,#1a1a1a)}.isd-t .m{fill:var(--muted,#595959)}.isd-t .base{stroke:var(--border,#c8c8c8);stroke-width:1}.isd-t .ln{stroke:var(--accent,#0b57d0);stroke-width:2;fill:none}.isd-t .pre{stroke-dasharray:4 3}.isd-t .pt{fill:var(--accent,#0b57d0)}.isd-t .hp{fill:var(--bg,#fff);stroke:var(--accent,#0b57d0);stroke-width:2}</style><line class="base" x1="64" y1="118" x2="296" y2="118"/><text class="m" x="58" y="118" dy=".35em" text-anchor="end">0</text><line class="ln" x1="72" y1="43.04" x2="126" y2="47.27"/><line class="ln" x1="126" y1="47.27" x2="180" y2="57.88"/><line class="ln" x1="180" y1="57.88" x2="234" y2="58.28"/><line class="ln pre" x1="234" y1="58.28" x2="288" y2="58.28"/><circle class="pt" cx="72" cy="43.04" r="4"/><circle class="pt" cx="126" cy="47.27" r="4"/><circle class="pt" cx="180" cy="57.88" r="4"/><circle class="pt" cx="234" cy="58.28" r="4"/><circle class="hp" cx="288" cy="58.28" r="4"/><text class="v" x="64" y="43.04" dy=".35em" text-anchor="end">1.2613</text><text class="v" x="296" y="58.28" dy=".35em" text-anchor="start">1.0049</text><text class="m" x="72" y="138" text-anchor="middle">2021</text><text class="m" x="126" y="138" text-anchor="middle">2022</text><text class="m" x="180" y="138" text-anchor="middle">2023</text><text class="m" x="234" y="138" text-anchor="middle">2024</text><text class="m" x="288" y="138" text-anchor="middle">2025</text><text class="m" x="288" y="155" text-anchor="middle">preliminary</text></svg>
